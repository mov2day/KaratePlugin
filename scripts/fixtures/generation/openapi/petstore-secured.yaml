openapi: 3.0.0
info:
  title: Sample Pet Store API
  version: 1.0.0
  description: A sample API for testing Karate DSL generation

servers:
  - url: http://localhost:8080/api/v1

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check (public)
      operationId: getHealth
      tags:
        - system
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "UP"

  /pets/{petId}/photo:
    post:
      summary: Upload a pet photo
      operationId: uploadPetPhoto
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
                  example: "Fluffy at the park"
      responses:
        '200':
          description: Photo uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: "https://cdn.example.com/pets/1.png"

  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    
    post:
      summary: Create a pet
      operationId: createPet
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pets/{petId}:
    get:
      summary: Get pet by ID
      operationId: getPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: ID of the pet
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found

    put:
      summary: Update a pet
      operationId: updatePet
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '200':
          description: Pet updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetWithOwner'

    delete:
      summary: Delete a pet
      operationId: deletePet
      tags:
        - pets
      security:
        - apiKeyAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Pet deleted

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    PetWithOwner:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required:
            - ownerName
          properties:
            ownerName:
              type: string
              example: "Alex Rivera"
            ownerEmail:
              type: string
              format: email
              example: "alex@example.com"

    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Fluffy"
        tag:
          type: string
          example: "cat"
        status:
          type: string
          enum: [available, pending, sold]
          example: "available"

    NewPet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Buddy"
        tag:
          type: string
          example: "dog"
        status:
          type: string
          enum: [available, pending, sold]
          example: "available"
