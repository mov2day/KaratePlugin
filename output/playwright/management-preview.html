<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karate Test Management Preview</title>
  <style>
    :root {
      --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --vscode-editor-font-family: "SFMono-Regular", Consolas, monospace;
      --vscode-foreground: #d4d4d4; --vscode-descriptionForeground: #8a8a8a;
      --vscode-editor-background: #1e1e1e; --vscode-editorWidget-background: #252526;
      --vscode-sideBar-background: #1a1a1a; --vscode-panel-border: #3c3c3c; --vscode-widget-border: #3c3c3c;
      --vscode-button-background: #0e639c; --vscode-button-hoverBackground: #1177bb; --vscode-button-foreground: #fff;
      --vscode-textLink-foreground: #3b9dff; --vscode-focusBorder: #3b9dff;
      --vscode-input-background: #2a2a2a; --vscode-input-foreground: #d4d4d4; --vscode-input-placeholderForeground: #6e6e6e; --vscode-input-border: #3c3c3c;
      --vscode-dropdown-background: #2a2a2a; --vscode-dropdown-foreground: #d4d4d4;
      --vscode-list-hoverBackground: #2a2a2a; --vscode-list-activeSelectionBackground: #37373d; --vscode-list-activeSelectionForeground: #fff;
      --vscode-testing-iconPassed: #5dcaa5; --vscode-testing-iconFailed: #f14c4c; --vscode-testing-iconQueued: #ef9f27;
      --vscode-charts-blue: #3b9dff; --vscode-badge-background: #3c3c3c; --vscode-badge-foreground: #d4d4d4;
      --vscode-toolbar-hoverBackground: #2a2a2a;
    }
  </style>
  <link rel="stylesheet" href="../../media/test-management.css">
</head>
<body data-management-layout="expanded" data-app-icon="../../resources/icon.png">
  <div id="root"></div>
  <script>
    document.body.dataset.managementLayout = new URLSearchParams(location.search).get('layout') || 'expanded';
    const snapshot = {
      folderName: 'KaratePlugin', folderPath: '/workspace/KaratePlugin', folders: [{ name: 'KaratePlugin', path: '/workspace/KaratePlugin' }],
      featureCount: 18,
      features: [
        { path: 'features/users/users-api.feature', scenarios: [{ name: 'Create user returns 201', tags: ['@smoke', '@positive'], line: 8, owner: 'API Platform', status: 'Active', zephyrKey: 'KAR-142', flakiness: .98, flakinessTier: 'stable', flakinessRuns: 24 }] },
        { path: 'features/orders/order-lifecycle.feature', scenarios: [{ name: 'Submit and approve an order', tags: ['@regression'], line: 14, owner: 'Checkout', status: 'Active', zephyrKey: 'KAR-188', flakiness: .86, flakinessTier: 'watch', flakinessRuns: 18 }] }
      ],
      runs: [
        { id: 'a13f9c2e-demo', timestamp: Date.now() - 120000, status: 'failed', summary: { totalScenarios: 48, passPercentage: 94, passed: 45, failed: 3, executionTime: '1m 42s' } },
        { id: '7e41b986-demo', timestamp: Date.now() - 86400000, status: 'success', summary: { totalScenarios: 48, passPercentage: 100, passed: 48, failed: 0, executionTime: '1m 36s' } }
      ],
      findings: [
        { id: 'finding-1', title: 'Add coverage for DELETE /users/{id}', state: 'New', severity: 'High', source: 'coverage' },
        { id: 'finding-2', title: 'Review changed order response schema', state: 'Investigating', severity: 'Medium', source: 'spec-diff' },
        { id: 'finding-3', title: 'Stabilise payment retry scenario', state: 'Fixed', severity: 'Medium', source: 'flakiness' }
      ]
    };
    window.acquireVsCodeApi = () => ({
      postMessage(message) {
        if (message.command === 'getManagementSnapshot') setTimeout(() => window.postMessage({ type: 'managementSnapshot', data: snapshot }, '*'), 0);
        if (message.command === 'getTemplates') setTimeout(() => window.postMessage({ type: 'templates', data: [] }, '*'), 0);
        if (message.command === 'getHistory') setTimeout(() => window.postMessage({ type: 'history', data: [] }, '*'), 0);
        if (message.command === 'managementReady') setTimeout(() => window.postMessage({ type: 'navigateManagement', area: 'overview' }, '*'), 10);
      },
      getState() { return undefined; },
      setState(state) { return state; }
    });
  </script>
  <script src="../../media/test-management.js"></script>
</body>
</html>
