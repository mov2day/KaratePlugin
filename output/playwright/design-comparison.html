<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Karate UI comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; background: #0d0d0d; color: #ddd; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; display: grid; grid-template-columns: 1fr; gap: 14px; }
    figure { margin: 0; min-width: 0; }
    figcaption { margin-bottom: 7px; color: #9da1a6; font-weight: 650; letter-spacing: .08em; }
    img { display: block; width: 100%; height: auto; border: 1px solid #333; }
  </style>
</head>
<body>
  <main>
    <figure><figcaption>REFERENCE MOCK</figcaption><img src="mock-create-reference.png" alt="Reference mock"></figure>
    <figure><figcaption>IMPLEMENTATION · FINAL PASS</figcaption><img src="implementation-create-v2.png" alt="Current implementation"></figure>
  </main>
</body>
</html>
