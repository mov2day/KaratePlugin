name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.tag.outputs.exists == 'false' }}
      vsix: karate-test-generator-${{ steps.version.outputs.tag }}.vsix

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag exists
        id: tag
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.tag.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        if: steps.tag.outputs.exists == 'false'
        run: npm ci

      - name: Setup Java
        if: steps.tag.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Fetch Karate 2 jar for Workbench tests
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.1.4 --repo karatelabs/karate --pattern 'karate-2.1.4.jar' --dir "$RUNNER_TEMP"
          echo "1f743f4acc56526b39bd88c84bfe4491c46d5e94f4ab5a38c437c9400dbc2488  $RUNNER_TEMP/karate-2.1.4.jar" | sha256sum -c -
          echo "KARATE_TEST_JAR=$RUNNER_TEMP/karate-2.1.4.jar" >> "$GITHUB_ENV"

      - name: Verify
        if: steps.tag.outputs.exists == 'false'
        run: npm run verify

      - name: Package
        if: steps.tag.outputs.exists == 'false'
        run: npx vsce package --out karate-test-generator-${{ steps.version.outputs.tag }}.vsix

      - name: Tag and create GitHub release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "karate-test-generator-${{ steps.version.outputs.tag }}.vsix" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Upload package
        if: steps.tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: karate-test-generator-${{ steps.version.outputs.tag }}.vsix
          if-no-files-found: error

  # Publishes with short-lived OIDC tokens (trusted publishing); no PATs are stored.
  # The trusted publisher policies on both marketplaces pin this workflow file
  # (release.yml) and the `publish` environment, so renaming either breaks publishing.
  publish:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "${{ needs.release.outputs.vsix }}"

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.3.0 publish "${{ needs.release.outputs.vsix }}" --trusted-publishing
